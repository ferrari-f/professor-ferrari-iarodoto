<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iaródoto — Tutor de Humanas · Professor Ferrari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --grey: #999395;
    --offwhite: #f1f1f1;
    --black: #0d0d0d;
    --card: #18181b;
    --card-hover: #202024;
    --green: #0a2200;
    --yellow: #ffde59;
    --red: #d51818;
    --blue: #2f6fd6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--black);
    color: var(--offwhite);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(10px);
    background: rgba(13, 13, 13, 0.85);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-dot {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--yellow), #ffb347);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Saira', sans-serif;
    font-weight: 800;
    color: var(--black);
    font-size: 1rem;
    position: relative;
    flex-shrink: 0;
  }

  .brand-dot::after {
    content: "";
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #3ddc73;
    border: 2px solid var(--black);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(61, 220, 115, 0.5); }
    50% { box-shadow: 0 0 0 4px rgba(61, 220, 115, 0); }
  }

  .brand-text h1 {
    font-family: 'Saira', sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
    margin: 0;
    line-height: 1.15;
  }

  .brand-text p {
    margin: 2px 0 0;
    font-size: 0.78rem;
    color: var(--grey);
    font-weight: 500;
  }

  #searchToggleWrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--grey);
    font-weight: 500;
    flex-shrink: 0;
  }

  #searchToggleWrap input[type="checkbox"] {
    accent-color: var(--yellow);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px 12px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 82%;
    padding: 14px 18px;
    line-height: 1.6;
    font-size: 0.96rem;
    white-space: pre-wrap;
    border-radius: 20px;
    animation: rise 0.25s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: var(--blue);
    color: white;
    border-radius: 20px 20px 4px 20px;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--card);
    color: var(--offwhite);
    border-radius: 4px 20px 20px 20px;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .msg.bot.loading {
    color: var(--grey);
    font-style: italic;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .msg.bot.loading::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--yellow);
    animation: blink 1.1s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }

  .msg img.thumb {
    max-width: 220px;
    display: block;
    margin-bottom: 10px;
    border-radius: 12px;
  }

  #attachmentBar {
    display: none;
    align-items: center;
    gap: 10px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 8px;
  }

  #attachmentBar.visible { display: flex; }

  #attachmentBar img {
    width: 42px;
    height: 42px;
    object-fit: cover;
    border-radius: 10px;
  }

  #attachmentBar span {
    font-size: 0.8rem;
    color: var(--grey);
    font-weight: 500;
  }

  #attachmentBar button {
    background: none;
    border: none;
    color: var(--red);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
  }

  #attachmentBar button:hover {
    background: rgba(213, 24, 24, 0.1);
  }

  form#composer {
    padding: 12px 20px 22px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--card);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 20px;
  }

  textarea#textInput {
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    color: var(--offwhite);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    padding: 12px 6px 12px 14px;
    min-height: 24px;
    max-height: 140px;
  }

  textarea#textInput:focus {
    outline: none;
  }

  label.iconBtn {
    cursor: pointer;
    background: transparent;
    border: none;
    color: var(--grey);
    font-size: 1.2rem;
    padding: 10px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  label.iconBtn:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  button#sendBtn {
    background: var(--yellow);
    color: var(--black);
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    margin: 6px 6px 6px 0;
    transition: transform 0.1s, opacity 0.15s;
  }

  button#sendBtn:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  button#sendBtn:disabled {
    background: #3a3a3a;
    color: var(--grey);
    cursor: not-allowed;
  }

  #fileInput { display: none; }

  /* Scrollbar discreta */
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 8px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-dot">IA</div>
    <div class="brand-text">
      <h1>Iaródoto</h1>
      <p>seu tutor de Humanas · Professor Ferrari</p>
    </div>
  </div>
  <div id="searchToggleWrap">
    <label for="searchToggle">Buscar na internet</label>
    <input type="checkbox" id="searchToggle" />
  </div>
</header>

<div id="chat">
  <div class="msg bot">Envie uma pergunta, um resumo para revisar, ou uma foto de um exercício/texto para eu transcrever e comentar.</div>
</div>

<div id="attachmentBar">
  <img id="attachmentThumb" src="" alt="Imagem anexada" />
  <span>Imagem anexada</span>
  <button id="removeAttachment" type="button">Remover</button>
</div>

<form id="composer">
  <input type="file" id="fileInput" accept="image/*" />
  <label class="iconBtn" for="fileInput" title="Anexar imagem">📷</label>
  <textarea id="textInput" placeholder="Digite sua pergunta ou cole (Ctrl+V) um print..." rows="1"></textarea>
  <button id="sendBtn" type="submit">Enviar</button>
</form>

<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('composer');
const textInput = document.getElementById('textInput');
const fileInput = document.getElementById('fileInput');
const sendBtn = document.getElementById('sendBtn');
const searchToggle = document.getElementById('searchToggle');
const attachmentBar = document.getElementById('attachmentBar');
const attachmentThumb = document.getElementById('attachmentThumb');
const removeAttachmentBtn = document.getElementById('removeAttachment');

let history = [];
let pendingImage = null; // { base64, mimeType }

function setAttachment(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const base64 = reader.result.split(',')[1];
    pendingImage = { base64, mimeType: file.type };
    attachmentThumb.src = reader.result;
    attachmentBar.classList.add('visible');
  };
  reader.readAsDataURL(file);
}

function clearAttachment() {
  pendingImage = null;
  attachmentThumb.src = '';
  attachmentBar.classList.remove('visible');
  fileInput.value = '';
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  setAttachment(file);
});

removeAttachmentBtn.addEventListener('click', clearAttachment);

// Permite colar (Ctrl+V / Cmd+V) uma imagem copiada (print, screenshot) direto no campo
textInput.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type && item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) {
        setAttachment(file);
        e.preventDefault();
      }
      break;
    }
  }
});

function addMessage(role, text, imageDataUrl) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if (imageDataUrl) {
    const img = document.createElement('img');
    img.src = imageDataUrl;
    img.className = 'thumb';
    div.appendChild(img);
  }
  const textNode = document.createElement('div');
  textNode.textContent = text;
  div.appendChild(textNode);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = textInput.value.trim();
  if (!message && !pendingImage) return;

  const imageDataUrl = pendingImage ? `data:${pendingImage.mimeType};base64,${pendingImage.base64}` : null;
  addMessage('user', message || '(imagem enviada)', imageDataUrl);

  const loadingDiv = addMessage('bot', 'Analisando...');
  loadingDiv.classList.add('loading');

  sendBtn.disabled = true;
  const imageToSend = pendingImage;
  clearAttachment();
  textInput.value = '';
  textInput.style.height = 'auto';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        imageBase64: imageToSend ? imageToSend.base64 : null,
        imageMimeType: imageToSend ? imageToSend.mimeType : null,
        history,
        useSearch: searchToggle.checked,
      }),
    });

    const data = await res.json();
    loadingDiv.remove();

    if (!res.ok) {
      addMessage('bot', data.error || 'Erro ao consultar a IA.');
      return;
    }

    addMessage('bot', data.text);

    // Atualiza histórico (apenas texto, para manter contexto da conversa)
    history.push({ role: 'user', parts: [{ text: message || '(imagem enviada)' }] });
    history.push({ role: 'model', parts: [{ text: data.text }] });

  } catch (err) {
    loadingDiv.remove();
    addMessage('bot', 'Erro de conexão. Tente novamente.');
  } finally {
    sendBtn.disabled = false;
  }
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 140) + 'px';
});
</script>

</body>
</html>
