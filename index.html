<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Professor Ferrari — Tutor de História</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;700;800&family=Lustria&display=swap" rel="stylesheet">
<style>
  :root {
    --grey: #999395;
    --offwhite: #f1f1f1;
    --black: #0d0d0d;
    --green: #0a2200;
    --yellow: #ffde59;
    --red: #d51818;
    --blue: #004aad;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--black);
    color: var(--offwhite);
    font-family: 'Lustria', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 4px solid var(--yellow);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  header::after {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 14px; height: 14px;
    background: var(--red);
  }

  header h1 {
    font-family: 'Saira', sans-serif;
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: uppercase;
  }

  header span {
    color: var(--yellow);
  }

  #searchToggleWrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Saira', sans-serif;
    font-size: 0.75rem;
    color: var(--grey);
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 85%;
    padding: 12px 16px;
    line-height: 1.5;
    font-size: 0.97rem;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--blue);
    color: var(--offwhite);
    border-radius: 2px 2px 0 2px;
  }

  .msg.bot {
    align-self: flex-start;
    background: #1a1a1a;
    border-left: 3px solid var(--yellow);
    color: var(--offwhite);
    border-radius: 0 2px 2px 2px;
  }

  .msg.bot.loading {
    color: var(--grey);
    font-style: italic;
  }

  .msg img.thumb {
    max-width: 200px;
    display: block;
    margin-bottom: 8px;
    border: 2px solid var(--yellow);
  }

  form#composer {
    border-top: 4px solid var(--yellow);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  #imagePreview {
    max-width: 60px;
    max-height: 60px;
    display: none;
    border: 2px solid var(--red);
  }

  textarea#textInput {
    flex: 1;
    resize: none;
    background: #1a1a1a;
    border: 1px solid var(--grey);
    color: var(--offwhite);
    font-family: 'Lustria', serif;
    font-size: 0.95rem;
    padding: 10px 12px;
    min-height: 44px;
    max-height: 140px;
  }

  textarea#textInput:focus {
    outline: 2px solid var(--yellow);
  }

  label.iconBtn {
    cursor: pointer;
    background: #1a1a1a;
    border: 1px solid var(--grey);
    color: var(--offwhite);
    font-family: 'Saira', sans-serif;
    font-size: 1.1rem;
    padding: 10px 12px;
  }

  button#sendBtn {
    background: var(--yellow);
    color: var(--black);
    border: none;
    font-family: 'Saira', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.85rem;
    padding: 10px 18px;
    cursor: pointer;
  }

  button#sendBtn:disabled {
    background: var(--grey);
    cursor: not-allowed;
  }

  #fileInput { display: none; }

  #attachmentBar {
    display: none;
    align-items: center;
    gap: 10px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 8px 20px 0;
  }

  #attachmentBar.visible { display: flex; }

  #attachmentBar img {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border: 2px solid var(--yellow);
  }

  #attachmentBar span {
    font-family: 'Saira', sans-serif;
    font-size: 0.8rem;
    color: var(--grey);
  }

  #attachmentBar button {
    background: none;
    border: 1px solid var(--red);
    color: var(--red);
    font-family: 'Saira', sans-serif;
    font-size: 0.75rem;
    padding: 4px 10px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Professor <span>Ferrari</span> · Tutor de História</h1>
  <div id="searchToggleWrap">
    <label for="searchToggle">Buscar na internet</label>
    <input type="checkbox" id="searchToggle" />
  </div>
</header>

<div id="chat">
  <div class="msg bot">Envie uma pergunta, um resumo para revisar, ou uma foto de um exercício/texto para eu transcrever e comentar.</div>
</div>

<div id="attachmentBar">
  <img id="attachmentThumb" src="" alt="Imagem anexada" />
  <span>Imagem anexada</span>
  <button id="removeAttachment" type="button">Remover</button>
</div>

<form id="composer">
  <input type="file" id="fileInput" accept="image/*" />
  <label class="iconBtn" for="fileInput" title="Anexar imagem">📷</label>
  <textarea id="textInput" placeholder="Digite sua pergunta ou cole (Ctrl+V) um print..." rows="1"></textarea>
  <button id="sendBtn" type="submit">Enviar</button>
</form>

<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('composer');
const textInput = document.getElementById('textInput');
const fileInput = document.getElementById('fileInput');
const sendBtn = document.getElementById('sendBtn');
const searchToggle = document.getElementById('searchToggle');
const attachmentBar = document.getElementById('attachmentBar');
const attachmentThumb = document.getElementById('attachmentThumb');
const removeAttachmentBtn = document.getElementById('removeAttachment');

let history = [];
let pendingImage = null; // { base64, mimeType }

function setAttachment(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const base64 = reader.result.split(',')[1];
    pendingImage = { base64, mimeType: file.type };
    attachmentThumb.src = reader.result;
    attachmentBar.classList.add('visible');
  };
  reader.readAsDataURL(file);
}

function clearAttachment() {
  pendingImage = null;
  attachmentThumb.src = '';
  attachmentBar.classList.remove('visible');
  fileInput.value = '';
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  setAttachment(file);
});

removeAttachmentBtn.addEventListener('click', clearAttachment);

// Permite colar (Ctrl+V / Cmd+V) uma imagem copiada (print, screenshot) direto no campo
textInput.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type && item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) {
        setAttachment(file);
        e.preventDefault();
      }
      break;
    }
  }
});

function addMessage(role, text, imageDataUrl) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if (imageDataUrl) {
    const img = document.createElement('img');
    img.src = imageDataUrl;
    img.className = 'thumb';
    div.appendChild(img);
  }
  const textNode = document.createElement('div');
  textNode.textContent = text;
  div.appendChild(textNode);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = textInput.value.trim();
  if (!message && !pendingImage) return;

  const imageDataUrl = pendingImage ? `data:${pendingImage.mimeType};base64,${pendingImage.base64}` : null;
  addMessage('user', message || '(imagem enviada)', imageDataUrl);

  const loadingDiv = addMessage('bot', 'Analisando...');
  loadingDiv.classList.add('loading');

  sendBtn.disabled = true;
  const imageToSend = pendingImage;
  clearAttachment();
  textInput.value = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        imageBase64: imageToSend ? imageToSend.base64 : null,
        imageMimeType: imageToSend ? imageToSend.mimeType : null,
        history,
        useSearch: searchToggle.checked,
      }),
    });

    const data = await res.json();
    loadingDiv.remove();

    if (!res.ok) {
      addMessage('bot', data.error || 'Erro ao consultar a IA.');
      return;
    }

    addMessage('bot', data.text);

    // Atualiza histórico (apenas texto, para manter contexto da conversa)
    history.push({ role: 'user', parts: [{ text: message || '(imagem enviada)' }] });
    history.push({ role: 'model', parts: [{ text: data.text }] });

  } catch (err) {
    loadingDiv.remove();
    addMessage('bot', 'Erro de conexão. Tente novamente.');
  } finally {
    sendBtn.disabled = false;
  }
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 140) + 'px';
});
</script>

</body>
</html>
